[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
clap = { version = "4.5.41", features = ["derive"] }
dirs = "6.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.20.0"
tokio = { version = "1.46.1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
toml = "1.1.3"
ts-rs = { version = "11.0.1", features = ["serde-compat", "serde-json-impl"] }
