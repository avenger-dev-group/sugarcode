[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "4.0.2"
eventsource-stream = "0.2.3"
futures-util = "0.3.31"
clap = { version = "4.5.41", features = ["derive"] }
dirs = "6.0.0"
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
libc = "=0.2.189"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
tokio = { version = "1.46.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.16"
toml = "1.1.3"
ts-rs = { version = "11.0.1", features = ["serde-compat", "serde-json-impl"] }
url = "2.5.4"
zeroize = "1.8.1"
windows-sys = "0.61.2"
