[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "3.0.3"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
uuid = { version = "1.24.0", features = ["v7"] }
base64 = "0.22.1"
cap-fs-ext = "=4.0.2"
cap-std = "4.0.2"
git2 = { version = "0.20.2", default-features = false, features = ["vendored-libgit2"] }
landlock = "=0.4.5"
libc = "=0.2.189"
portable-pty = "0.9.0"
regex = "1.11.1"
glob = "0.3.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
seccompiler = "=0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
tokio = { version = "1.46.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.16"
url = "2.5.4"
windows-sys = "0.61.2"
