[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
uuid = { version = "1.24.0", features = ["v7"] }
base64 = "0.22.1"
cap-fs-ext = "=4.0.2"
cap-std = "4.0.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.31"
git2 = { version = "0.20.2", default-features = false, features = ["vendored-libgit2"] }
jsonschema = { version = "0.49.2", default-features = false }
clap = { version = "4.5.41", features = ["derive"] }
dirs = "6.0.0"
landlock = "=0.4.5"
libc = "=0.2.189"
portable-pty = "0.9.0"
ratatui = "0.30.2"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex = "1.11.1"
glob = "0.3.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.0.4"
seccompiler = "=0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
tokio = { version = "1.46.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.16"
toml = "1.1.3"
ts-rs = { version = "11.0.1", features = ["serde-compat", "serde-json-impl"] }
url = "2.5.4"
zeroize = "1.8.1"
windows-sys = "0.61.2"
