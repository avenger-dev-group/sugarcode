name: Build SugarCode Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sugarcode-desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Desktop / ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            asset_name: macos-arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            asset_name: macos-x64
          - runner: windows-2025
            platform: win32
            arch: x64
            asset_name: windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Desktop version
        id: desktop
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./apps/desktop/package.json').version + require('node:os').EOL)"

      - name: Build installers
        run: pnpm desktop:make

      - name: Verify packaged application
        run: node scripts/verify-packaged-desktop.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Verify macOS artifacts
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-desktop-artifacts.sh ${{ matrix.arch }}

      - name: Verify Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-desktop-artifacts.ps1 -Architecture ${{ matrix.arch }}

      - name: Prepare macOS release assets
        if: runner.os == 'macOS'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          DESKTOP_VERSION: ${{ steps.desktop.outputs.version }}
        run: |
          mkdir -p release-assets
          dmg_source="$(find apps/desktop/out/make -maxdepth 1 -type f -name 'SugarCode-*.dmg' -print -quit)"
          zip_source="$(find "apps/desktop/out/make/zip/darwin/${{ matrix.arch }}" -maxdepth 1 -type f -name 'SugarCode-*.zip' -print -quit)"
          test -n "$dmg_source"
          test -n "$zip_source"
          cp "$dmg_source" "release-assets/SugarCode-${DESKTOP_VERSION}-${ASSET_NAME}.dmg"
          cp "$zip_source" "release-assets/SugarCode-${DESKTOP_VERSION}-${ASSET_NAME}.zip"

      - name: Prepare Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          DESKTOP_VERSION: ${{ steps.desktop.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $setupFiles = @(Get-ChildItem "apps/desktop/out/make/squirrel.windows/${{ matrix.arch }}" -File -Filter "* Setup.exe")
          if ($setupFiles.Count -ne 1) {
            throw "Expected one Windows Setup.exe, found $($setupFiles.Count)."
          }
          Copy-Item $setupFiles[0].FullName "release-assets/SugarCode-$env:DESKTOP_VERSION-$env:ASSET_NAME-Setup.exe"

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Read Desktop version
        id: desktop
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./apps/desktop/package.json').version + require('node:os').EOL)"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.desktop.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" || {
              echo "Tag ${tag} already points to another commit."
              exit 1
            }
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          elif git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            gh release create "$tag" release-assets/* \
              --verify-tag \
              --title "SugarCode ${tag}" \
              --generate-notes \
              --latest
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "SugarCode ${tag}" \
              --generate-notes \
              --latest
          fi
