name: Build SugarCode Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v, for example 3.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sugarcode-desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.revision.outputs.commit_sha }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Desktop releases must be dispatched from the main branch."
          exit 1

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Synchronize release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            tagged_version="$(git show "${tag}:package.json" | node -e "let input = ''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));")"
            test "$tagged_version" = "$RELEASE_VERSION" || {
              echo "Tag ${tag} contains package version ${tagged_version}, expected ${RELEASE_VERSION}."
              exit 1
            }
            echo "Reusing existing source tag ${tag}."
          else
            node scripts/set-build-version.mjs
          fi

      - name: Commit release version and create source tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${RELEASE_VERSION}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Source tag ${tag} already exists; leaving it unchanged."
            exit 0
          fi

          if ! git diff --quiet -- package.json apps/desktop/package.json Cargo.toml Cargo.lock; then
            git add package.json apps/desktop/package.json Cargo.toml Cargo.lock
            git commit -m "chore(release): v${RELEASE_VERSION}"
            git push origin HEAD:main
          fi

          git tag -a "$tag" -m "SugarCode ${tag}"
          git push origin "$tag"

      - name: Record release revision
        id: revision
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          echo "commit_sha=$(git rev-list -n 1 "$tag")" >> "$GITHUB_OUTPUT"

  build:
    name: Desktop / ${{ matrix.asset_name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            asset_name: macos-arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            asset_name: macos-x64
          - runner: windows-2025
            platform: win32
            arch: x64
            asset_name: windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm desktop:make

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: pnpm --filter @sugarcode/desktop exec electron-forge package --arch ${{ matrix.arch }}

      - name: Build macOS ZIP
        if: runner.os == 'macOS'
        run: pnpm --filter @sugarcode/desktop exec electron-forge make --skip-package --arch ${{ matrix.arch }} --targets @electron-forge/maker-zip

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @sugarcode/desktop exec electron-forge make --skip-package --arch "${{ matrix.arch }}" --targets @electron-forge/maker-dmg; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "DMG creation failed after ${attempt} attempts."
              exit 1
            fi

            echo "DMG creation attempt ${attempt} failed; cleaning up the transient mount and retrying."
            hdiutil detach "/Volumes/SugarCode" -force >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done

      - name: Verify packaged application
        run: node scripts/verify-packaged-desktop.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Verify macOS artifacts
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-desktop-artifacts.sh ${{ matrix.arch }}

      - name: Verify Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-desktop-artifacts.ps1 -Architecture ${{ matrix.arch }}

      - name: Prepare macOS release assets
        if: runner.os == 'macOS'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-assets
          dmg_source="$(find apps/desktop/out/make -maxdepth 1 -type f -name 'SugarCode-*.dmg' -print -quit)"
          zip_source="$(find "apps/desktop/out/make/zip/darwin/${{ matrix.arch }}" -maxdepth 1 -type f -name 'SugarCode-*.zip' -print -quit)"
          test -n "$dmg_source"
          test -n "$zip_source"
          cp "$dmg_source" "release-assets/SugarCode-${DESKTOP_VERSION}-${ASSET_NAME}.dmg"
          cp "$zip_source" "release-assets/SugarCode-${DESKTOP_VERSION}-${ASSET_NAME}.zip"

      - name: Prepare Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $setupFiles = @(Get-ChildItem "apps/desktop/out/make/squirrel.windows/${{ matrix.arch }}" -File -Filter "* Setup.exe")
          if ($setupFiles.Count -ne 1) {
            throw "Expected one Windows Setup.exe, found $($setupFiles.Count)."
          }
          Copy-Item $setupFiles[0].FullName "release-assets/SugarCode-$env:DESKTOP_VERSION-$env:ASSET_NAME-Setup.exe"

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create update manifest
        env:
          RELEASE_NOTES: SugarCode ${{ inputs.version }}
        run: node scripts/create-update-manifest.mjs "${{ inputs.version }}" release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_COMMIT_SHA" || {
              echo "Tag ${tag} already points to another commit."
              exit 1
            }
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          elif git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            gh release create "$tag" release-assets/* \
              --verify-tag \
              --title "SugarCode ${tag}" \
              --generate-notes \
              --latest
          else
            gh release create "$tag" release-assets/* \
              --target "$RELEASE_COMMIT_SHA" \
              --title "SugarCode ${tag}" \
              --generate-notes \
              --latest
          fi
