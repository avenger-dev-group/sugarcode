name: SugarCode CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check TypeScript workspace
        run: pnpm check

      - name: Test native filesystem read-only sandbox
        run: cargo test -p sugarcode-sandbox --test filesystem_read_only --locked -- --nocapture

      - name: Test native command network-denied sandbox
        run: cargo test -p sugarcode-sandbox --test network_denied --locked -- --nocapture

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build development CLI
        run: pnpm build:cli:dev

      - name: Test real Desktop CLI handshake
        run: pnpm --filter @sugarcode/desktop test:integration

      - name: Package Desktop and smoke bundled CLI
        run: pnpm desktop:package
