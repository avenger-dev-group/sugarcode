name: SugarCode CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check TypeScript workspace
        run: pnpm check

      - name: Test native filesystem read-only sandbox
        run: cargo test -p sugarcode-sandbox --test filesystem_read_only --locked -- --nocapture

      - name: Test native command network-denied sandbox
        run: cargo test -p sugarcode-sandbox --test network_denied --locked -- --nocapture

      - name: Test native command workspace-write boundary
        run: cargo test -p sugarcode-sandbox --test command_workspace_write --locked -- --nocapture

      - name: Test root and nested workspace instruction boundary
        run: cargo test -p sugarcode-tools --test workspace_instructions --locked -- --nocapture

      - name: Test bounded local workspace Skills boundary
        run: cargo test -p sugarcode-tools --test workspace_skills --locked -- --nocapture

      - name: Test bounded local MCP stdio and loopback HTTP boundary
        run: |
          cargo test -p sugarcode-mcp --test stdio_discovery --locked -- --nocapture
          cargo test -p sugarcode-mcp --test stdio_tool_call --locked -- --nocapture
          cargo test -p sugarcode-mcp --test streamable_http --locked -- --nocapture
          cargo test -p sugarcode-core runtime::tests::mcp_tools --locked -- --nocapture
          cargo test -p sugarcode-state --test rollout-repository mcp --locked -- --nocapture
          cargo test -p sugarcode-cli --test mcp_stdio_discovery --locked -- --nocapture

      - name: Test active workspace scope boundary
        run: cargo test -p sugarcode-tools --test workspace_scope --locked -- --nocapture

      - name: Test shared in-process agent surface runtime
        run: cargo test -p sugarcode-agent-runtime --locked -- --nocapture

      - name: Test durable headless exec surface
        run: cargo test -p sugarcode-cli --test exec --locked -- --nocapture

      - name: Test interactive terminal UI and PTY restoration
        run: |
          cargo test -p sugarcode-tui --locked -- --nocapture
          cargo test -p sugarcode-cli --test tui --locked -- --nocapture

      - name: Test user-confirmed Desktop terminal bridge
        run: |
          cargo test -p sugarcode-terminal --locked -- --nocapture
          cargo test -p sugarcode-cli --test terminal_bridge --locked -- --ignored --nocapture

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build development CLI
        run: pnpm build:cli:dev

      - name: Package Desktop and smoke bundled CLI
        run: pnpm desktop:package
