name: SugarCode CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Set up MSYS2 for bundled FFmpeg
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check TypeScript workspace
        run: pnpm check

      - name: Test Desktop end-to-end navigation and local knowledge flow
        run: pnpm test:e2e

      - name: Benchmark knowledge retrieval
        if: runner.os == 'macOS'
        run: pnpm test:performance

      - name: Test native filesystem read-only sandbox
        run: cargo test -p sugarcode-sandbox --test filesystem_read_only --locked -- --nocapture

      - name: Test native command network-denied sandbox
        run: cargo test -p sugarcode-sandbox --test network_denied --locked -- --nocapture

      - name: Test native command workspace-write boundary
        run: cargo test -p sugarcode-sandbox --test command_workspace_write --locked -- --nocapture

      - name: Test root and nested workspace instruction boundary
        run: cargo test -p sugarcode-tools --test workspace_instructions --locked -- --nocapture

      - name: Test bounded local workspace Skills boundary
        run: cargo test -p sugarcode-tools --test workspace_skills --locked -- --nocapture

      - name: Test active workspace scope boundary
        run: cargo test -p sugarcode-tools --test workspace_scope --locked -- --nocapture

      - name: Test user-confirmed Desktop PTY boundary
        run: cargo test -p sugarcode-terminal --locked -- --nocapture

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Package Desktop runtime
        run: pnpm desktop:package
        env:
          SUGARCODE_MSYS2_BASH: ${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe
