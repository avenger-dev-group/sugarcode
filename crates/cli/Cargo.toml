[package]
name = "sugarcode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sugarcode"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sugarcode-app-server = { path = "../app-server" }
sugarcode-app-server-protocol = { path = "../app-server-protocol" }
sugarcode-credential-store = { path = "../credential-store" }
sugarcode-state = { path = "../state" }
sugarcode-tools = { path = "../tools" }
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
sugarcode-mcp = { path = "../mcp" }
tempfile.workspace = true
tokio-util.workspace = true
toml.workspace = true

[[test]]
name = "mcp_stdio_discovery"
path = "tests/mcp_stdio_discovery.rs"
harness = false
